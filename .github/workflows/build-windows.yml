name: Dry run (build without release)

# Пробная сборка вручную: проверяет секреты, сборку, подпись манифеста и настоящую загрузку файлов.
# Файлы попадают во временный черновик dry-run-… репозитория обновлений, который удаляется в том же шаге.
# Пользователи его не видят, релиз и тег не создаются.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Check release settings
        run: node scripts/check-release.mjs pre
        env:
          HAS_SIGNING_CERT: ${{ secrets.CSC_LINK != '' }}
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_GH_TOKEN != '' }}
          HAS_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
          ALLOW_UNSIGNED_UPDATES: ${{ vars.ALLOW_UNSIGNED_UPDATES }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Test release publishing script
        run: npm run test:release

      - name: Test database migrations and RLS policies
        run: npm run test:sql

      - name: Unit tests (voice, presence, file transfer)
        run: npm test

      # Публичные параметры клиента задаются в Settings → Secrets and variables → Actions → Variables.
      # Ключи Cloudflare Realtime SFU сюда НЕ передаются — они хранятся только в Supabase Edge Functions.
      - name: Build installer
        run: npm run dist
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ENABLE_GOOGLE_AUTH: ${{ vars.VITE_ENABLE_GOOGLE_AUTH }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Sign update manifest
        run: node scripts/sign-update-manifest.mjs release/latest.yml
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

      - name: Verify update metadata
        run: node scripts/check-release.mjs post

      - name: Rehearse upload (temporary draft, deleted right away)
        run: node scripts/publish-release.mjs --rehearse
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealismVoice-Setup
          path: |
            release/RealismVoice-Setup.exe
            release/RealismVoice-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
