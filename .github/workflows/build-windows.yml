name: Build Windows installer

# Ручная сборка без публикации. Выпуск версии — в release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test database migrations and RLS policies
        run: npm run test:sql

      # Публичные параметры клиента задаются в Settings → Secrets and variables → Actions → Variables.
      # Секреты LiveKit сюда НЕ передаются — они хранятся только в Supabase Edge Functions.
      - name: Build installer
        run: npm run dist
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ENABLE_GOOGLE_AUTH: ${{ vars.VITE_ENABLE_GOOGLE_AUTH }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealismVoice-Setup
          path: release/RealismVoice-Setup.exe
          if-no-files-found: error
