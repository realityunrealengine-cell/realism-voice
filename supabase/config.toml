# Минимальная конфигурация Supabase CLI для проекта Realism Voice.
# Связывание с облаком: supabase link --project-ref yqoxdrkxgnputpqsclzx
project_id = "realism-voice"

[functions.voice-sfu]
# Посредник к Cloudflare Realtime SFU. JWT проверяется внутри функции через auth.getUser().
verify_jwt = false

# Прежний голосовой сервер (LiveKit) — оставлен для версий 1.1.x и как вариант отката.
[functions.livekit-token]
# JWT проверяется внутри функции через auth.getUser() — это работает и с новыми
# асимметричными ключами подписи JWT Supabase.
verify_jwt = false
